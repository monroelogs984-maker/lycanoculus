buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.3.1'
group = 'com.glennfo.lycanoculus'

base {
    archivesName = 'lycanoculus'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=lycanoculus.mixins.json'
            mods {
                lycanoculus {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// Copied from the "Sovereign: Call of the Chasm" instance mods folder — the instance path
// contains a colon, which breaks the Java classpath separator on Linux, so the jars must
// live at a colon-free path. Re-copy them here if the instance's Lycanites/Oculus update.
def lycanitesJar = file('libs/lycanitesmobs-0.0.9-alpha.jar')
def oculusJar    = file('libs/oculus-mc1.20.1-1.8.0.jar')

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    compileOnly files(lycanitesJar, oculusJar)

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'lycanoculus.refmap.json'
    config 'lycanoculus.mixins.json'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'lycanoculus',
            'Specification-Vendor'    : 'glennfo',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'glennfo',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'lycanoculus.mixins.json'
        ])
    }
}
